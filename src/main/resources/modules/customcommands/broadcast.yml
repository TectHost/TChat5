name: broadcast

aliases:
  - bc

args:
  min: 1
  max: -1
  usage: "/broadcast <message>"
  usage-actions:
    - "[MESSAGE] <red>Usage: {usage}"

permission: "tchat.admin.command.broadcast"
no-permission-actions:
  - "[MESSAGE] <red>You don't have permission to use /broadcast."

# No cooldown field = no cooldown

actions:
  - "[BROADCAST] <red><bold>[BROADCAST] <color:#FFD700>»</color> <gray>{args}"