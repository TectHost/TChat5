name: me

aliases: []

args:
  min: 1
  max: -1
  usage: "/me <message>"
  usage-actions:
    - "[MESSAGE] <red>Usage: {usage}"

permission: "tchat.command.me"
no-permission-actions:
  - "[MESSAGE] <red>You don't have permission to use /me."

# No cooldown field = no cooldown

actions:
  - "[BROADCAST] {player}<gray>:</gray> {args}"