name: warning

aliases: []

args:
  min: 1
  max: -1
  usage: "/warning <message>"
  usage-actions:
    - "[MESSAGE] <red>Usage: {usage}"

permission: "tchat.admin.command.warning"
no-permission-actions:
  - "[MESSAGE] <red>You don't have permission to use /warning."

# No cooldown field = no cooldown

actions:
  - "[BROADCAST] <yellow><bold>[WARNING] <color:#FFD700>»</color> <gray>{args}"